/* ---------- Armazenamento local (substitui window.storage do Claude) ----------
   Fora do ambiente do Claude, window.storage não existe. Este bloco recria a
   mesma assinatura (get/set/delete), mas salvando no localStorage do próprio
   navegador. Isso significa: os dados ficam neste aparelho/navegador — não
   sincronizam automaticamente com outro dispositivo. */
window.storage = {
    async get(key, shared) {
        const raw = localStorage.getItem("cbv:" + key);
        if (raw === null)
            throw new Error("not found");
        return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
        localStorage.setItem("cbv:" + key, value);
        return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
        localStorage.removeItem("cbv:" + key);
        return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
        const keys = Object.keys(localStorage)
            .filter((k) => k.startsWith("cbv:" + (prefix || "")))
            .map((k) => k.slice(4));
        return { keys, prefix, shared: !!shared };
    },
};
